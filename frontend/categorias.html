<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha a Categoria - Desafio Brasilis</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    
    <!-- Botão Voltar -->
    <button class="btn-voltar" onclick="window.location.href='home.html'">
        <i class="fas fa-arrow-left"></i> Voltar
    </button>
    
    <!-- Container Principal -->
    <div class="categorias-container">
        
        <div class="categorias-title">ESCOLHA A CATEGORIA</div>
        <div class="categorias-subtitle">Selecione uma categoria ou jogue com perguntas de todas!</div>
        
        <!-- Grid de Categorias -->
        <div id="categoriasGrid" class="categorias-grid">
            <!-- Categorias serão inseridas aqui pelo JavaScript -->
        </div>
        
        <!-- Botão Mix (Todas as Categorias) -->
        <button class="btn-categoria btn-mix" onclick="iniciarQuiz('Mix')">
            <span class="categoria-icon">🎲</span>
            <div class="categoria-info">
                <span class="categoria-nome">MIX - Todas as Categorias</span>
                <span class="categoria-desc">Perguntas aleatórias de todas as categorias</span>
            </div>
        </button>
        
    </div>
    
    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/categorias.js"></script>
    
</body>
</html>
