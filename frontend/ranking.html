<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Desafio Brasilis</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="home-page">
    <!-- Botão Voltar -->
    <button class="btn-voltar" onclick="window.location.href='home.html'">
        <i class="fas fa-arrow-left"></i> Voltar
    </button>

    <div class="ranking-container">
        <h1 class="ranking-title">🏆 RANKING GLOBAL</h1>
        
        <!-- Filtros -->
        <div class="ranking-filters">
            <button class="filter-btn active" data-filter="all">Todos os Tempos</button>
            <button class="filter-btn" data-filter="month">Este Mês</button>
            <button class="filter-btn" data-filter="week">Esta Semana</button>
        </div>

        <!-- Tabela de Ranking -->
        <div class="ranking-table">
            <div class="ranking-header">
                <span class="rank-pos">POS</span>
                <span class="rank-player">JOGADOR</span>
                <span class="rank-points">PONTOS</span>
                <span class="rank-streak">STREAK</span>
                <span class="rank-games">PARTIDAS</span>
            </div>
            
            <div id="rankingList" class="ranking-list">
                <!-- Será preenchido via JavaScript -->
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Carregando ranking...
                </div>
            </div>
        </div>

        <!-- Sua Posição -->
        <div class="your-position" id="yourPosition" style="display: none;">
            <!-- Será preenchido via JavaScript -->
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ranking.js"></script>

</body>
</html>
