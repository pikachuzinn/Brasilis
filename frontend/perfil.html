<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Desafio Brasilis</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="home-page">
    <!-- Botão Voltar -->
    <button class="btn-voltar" onclick="window.location.href='home.html'">
        <i class="fas fa-arrow-left"></i> Voltar
    </button>

    <div class="perfil-container">
        <!-- Header do Perfil -->
        <div class="perfil-header">
            <div class="perfil-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <h2 class="perfil-email" id="perfilEmail">usuario@gmail.com</h2>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>

        <!-- Estatísticas Gerais -->
        <div class="perfil-stats">
            <div class="stat-card">
                <i class="fas fa-trophy stat-icon"></i>
                <span class="stat-value" id="statPontos">0</span>
                <span class="stat-label">Pontos Totais</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-fire stat-icon"></i>
                <span class="stat-value" id="statStreak">0</span>
                <span class="stat-label">Streak Atual</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-gamepad stat-icon"></i>
                <span class="stat-value" id="statPartidas">0</span>
                <span class="stat-label">Partidas</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-star stat-icon"></i>
                <span class="stat-value" id="statMelhorStreak">0</span>
                <span class="stat-label">Melhor Streak</span>
            </div>
        </div>

        <!-- Conquistas -->
        <div class="perfil-conquistas">
            <h3 class="section-title">
                <i class="fas fa-medal"></i> Conquistas
            </h3>
            <div class="conquistas-grid" id="conquistasGrid">
                <!-- Será preenchido via JavaScript -->
            </div>
        </div>

        <!-- Histórico de Partidas -->
        <div class="perfil-historico">
            <h3 class="section-title">
                <i class="fas fa-history"></i> Últimas Partidas
            </h3>
            <div class="historico-list" id="historicoList">
                <!-- Será preenchido via JavaScript -->
                <div class="loading">Carregando histórico...</div>
            </div>
        </div>
    </div>

        <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/perfil.js"></script>

</body>
</html>
